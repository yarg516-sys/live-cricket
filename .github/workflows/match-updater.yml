name: Gemini AI Live Sports Automation Pipeline

on:
  schedule:
    # Runs every 30 minutes to discover new live matches, verify them, and publish updates
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Allows manual one-click trigger from the GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'sports-live-sync'
  cancel-in-progress: false

jobs:
  research-verify-publish:
    name: Research, Verify & Publish Live Matches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AI Research & Verification Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/update-matches.mjs

      - name: Commit and Push Verified Matches
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data.js

          if ! git diff --staged --quiet; then
            echo "Changes detected in js/data.js. Committing and pushing to main..."
            git commit -m "chore(live): AI researched & verified live matches [skip ci]"
            git push origin main
          else
            echo "No new match updates detected. Repository is up-to-date."
          fi

  deploy-pages:
    name: Auto Deploy Live Website to GitHub Pages
    needs: research-verify-publish
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
