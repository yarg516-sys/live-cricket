<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News — GlobalSports Live</title>
  <meta name="description" content="Sports news section.">

  <!-- Inter Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Top Live Scores Ticker -->
  <div class="ticker-wrap" aria-label="Live Scores Ticker">
    <div class="ticker-label">
      <span class="pulse-dot"></span>
      <span>Live Scores</span>
    </div>
    <div class="ticker-track">
      <div class="ticker-content" id="liveScoresTicker">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-wrapper">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon">🌐</div>
          <span>GLOBAL<span class="brand-accent">SPORTS</span></span>
        </a>
      </div>

      <nav class="main-nav" id="navMenu">
        <a href="index.html" class="nav-link">
          <span>Matches</span>
          <span class="nav-badge-live">
            <span class="pulse-dot"></span>
            <span id="globalLiveCount">0</span> LIVE
          </span>
        </a>
        <a href="news.html" class="nav-link active">
          <span>News</span>
        </a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="12" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Blank News Container -->
  <main class="news-section-wrapper">
    <div class="news-container-blank">
      <div class="blank-icon">📰</div>
      <h2>News</h2>
      <p>This section is currently blank.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="footer-logo">GLOBAL<span class="brand-accent">SPORTS</span></div>
        <p class="footer-desc">Real-time global sports tracking and streaming aggregator covering Football, Cricket, Basketball, Tennis & more.</p>
      </div>

      <nav class="footer-nav">
        <a href="index.html">Matches</a>
        <a href="news.html">News</a>
        <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">Back to Top ↑</a>
      </nav>

      <div class="footer-copyright">
        <p>© 2026 GlobalSports Live. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/liveEngine.js"></script>
  <script>
    // Simple theme and ticker support for standalone news.html
    const theme = localStorage.getItem('sports_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeToggleBtn')?.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('sports_theme', next);
    });
    // Run ticker
    new LiveEngine(SPORTS_DATA, null, null);
  </script>
</body>
</html>
